[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-tolerant-rebalancing"
version = "0.5.0"
description = "A reproducible study of forecast-risk tolerance and portfolio rebalancing"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.7", "cvxpy>=1.7", "clarabel>=0.11", "pyarrow>=18"]

[tool.setuptools.packages.find]
where = ["src"]
